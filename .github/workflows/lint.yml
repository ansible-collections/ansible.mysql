---
name: Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out collection
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run ansible-lint
        uses: ansible-community/antsibull-nox@stable-1
        with:
          sessions: ansible-lint
